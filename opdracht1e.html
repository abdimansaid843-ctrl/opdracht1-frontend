
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grid system - Piramide</title>

    <link rel="stylesheet" href="opdracht1e.css">
</head>

<body>

    <div class="container">
        <!-- comments gebruik ik om te visualiseren  wat de kolommen zijn-->

        <h1>Grid system - Piramide</h1>

        <!-- 12 columns -->
        <div class="row">
            <div class="col-12">1</div>
        </div>

        <!-- 6 + 6 columns -->
        <div class="row">
            <div class="col-6">1</div>
            <div class="col-6">2</div>
        </div>

        <!-- 4 + 4 + 4 columns -->
        <div class="row">
            <div class="col-4">1</div>
            <div class="col-4">2</div>
            <div class="col-4">3</div>
        </div>

        <!-- 3 + 3 + 3 + 3 columns -->
        <div class="row">
            <div class="col-3">1</div>
            <div class="col-3">2</div>
            <div class="col-3">3</div>
            <div class="col-3">4</div>
        </div>

    </div>

</body>

</html>
